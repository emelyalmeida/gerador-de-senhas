<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
    <!-- emely -->
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Gerador de Senhas</h1>
                <!-- emely -->
            </div>
            <div class="card-content">
                <div class="password-display">
                    <span id="password"></span>
                    <button id="copy-btn" title="Copiar senha">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="check-icon hidden">
                            <path d="M20 6 9 17l-5-5"></path>
                        </svg>
                    </button>
                </div>

                <div class="settings">
                    <div class="setting">
                        <label for="length">Tamanho da Senha: <span id="length-value">12</span></label>
                        <input type="range" id="length" min="4" max="32" value="12">
                    </div>

                    <div class="setting">
                        <label for="uppercase">Letras Maiúsculas (A-Z)</label>
                        <label class="switch">
                            <input type="checkbox" id="uppercase" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting">
                        <label for="lowercase">Letras Minúsculas (a-z)</label>
                        <label class="switch">
                            <input type="checkbox" id="lowercase" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting">
                        <label for="numbers">Números (0-9)</label>
                        <label class="switch">
                            <input type="checkbox" id="numbers" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting">
                        <label for="symbols">Símbolos (!@#$%^&*)</label>
                        <label class="switch">
                            <input type="checkbox" id="symbols" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <button id="generate-btn" class="generate-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2v6h-6"></path>
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                        <path d="M3 12a9 9 0 0 0 15 6.7L21 16"></path>
                        <path d="M21 22v-6h-6"></path>
                    </svg>
                    Gerar Nova Senha
                </button>
            </div>
        </div>
        <footer>
            <!-- emely -->
            Desenvolvido por Emely
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
